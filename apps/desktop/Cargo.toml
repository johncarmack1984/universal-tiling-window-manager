[package]
name = "universal-tiling-window-manager"
description = "A tiling window manager you drive from the keyboard, on Windows, the Mac and Linux, with one configuration for all three"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "universal-tiling-window-manager"

# The app itself; each executable below is a few lines that start it.
[lib]
path = "src/lib.rs"

# The command line, and with no command the tray app. Where a release's tray
# app sits beside it, it starts that copy instead. Tauri's installer treats it
# as the app's main executable: the one the Start menu, the installer's last
# step and an update's restart run.
[[bin]]
name = "universal-tiling-window-manager"
path = "src/main.rs"

# A release's tray app, with UI Access in its manifest (build.rs), which lets
# it move windows of apps running as administrator. Windows starts such a
# copy only when it is signed and installed where only an administrator can
# change it, so only the release job builds it, and the installer names it
# Window Manager.exe; every other build runs the tray from the command line.
[[bin]]
name = "window-manager"
path = "src/bin/window-manager.rs"
required-features = ["ui-access"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
# Links each executable's own manifest into it on Windows (build.rs).
embed-resource = "3.0"

[dependencies]
utwm-config.workspace = true
utwm-layout.workspace = true
# tauri::generate_context! writes the plugins' configuration out as JSON.
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Tauri 3 is in alpha; every Tauri crate is pinned to an exact release so an
# alpha bump can't change the app underneath a build.
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon", "image-png"] }
tauri-runtime-wry = "=3.0.0-alpha.5"
tauri-plugin-single-instance = "=3.0.0-alpha.3"
# The file picker behind Choose configuration….
tauri-plugin-dialog = "=3.0.0-alpha.4"

[target.'cfg(windows)'.dependencies]
utwm-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
utwm-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
utwm-linux.workspace = true
# Installs releases (src/updates.rs). Linux's own TLS is OpenSSL, whose
# library changes its name with each major version, so a release linked to
# one wouldn't start once a distribution moves to the next. rustls goes
# inside the executable instead, and trusts the system's certificates.
tauri-plugin-updater = { version = "=3.0.0-alpha.3", default-features = false, features = ["rustls-tls"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Installs releases (src/updates.rs). native-tls is the system's own TLS
# (Schannel on Windows, Security.framework on the Mac), so no TLS library of
# the plugin's choosing comes along.
tauri-plugin-updater = { version = "=3.0.0-alpha.3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The menu library Tauri builds on, at the version it pins, so the tests can
# check that every menu accelerator this app writes parses the way Tauri will
# parse it (Tauri drops one that doesn't, silently).
muda = "=0.20.0"

[features]
# Release builds embed their configuration; `cargo install` builds this way.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Builds the tray app's UI Access executable, window-manager, as a release
# ships it on Windows. Only the release job turns this on: unsigned, or
# anywhere but Program Files, that executable won't start.
ui-access = []

[lints]
workspace = true
