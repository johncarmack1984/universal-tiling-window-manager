name: release

# release-please (the pinned action, on the workflow's own GITHUB_TOKEN) keeps
# a release PR open from conventional-commit history: the version bump, the
# CHANGELOG, and every version stamp through extra-files. Merging it lands the
# bumped manifest on main, and this run ships it: the release job cuts the
# vX.Y.Z tag and a draft GitHub Release, and CI gates the tag. Then the Mac
# app is built for Apple silicon and Intel, signed with the Developer ID and
# notarized, and the Windows installer, signed through Azure Artifact Signing,
# and the Linux executable are built beside it. All three go on the draft
# with the updater's latest.json, and publishing the draft comes last.
# Installed copies read latest.json from the latest published release, so
# until then they see the release before it, and a release that failed
# anywhere on the way never reaches them.
on:
  push:
    branches: [main]

permissions: {}

# One release run at a time, never cancelled: a queued run must not tag a
# commit its gates didn't see, and the cut step tags only its own commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release-please's branch pushes, and the tag and release cut below
      pull-requests: write # release-please's PR bookkeeping, and the label flip
    outputs:
      release_created: ${{ steps.effective.outputs.release_created }}
      tag_name: ${{ steps.effective.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # skip-github-release in the config keeps the action away from tagging;
      # the cut step below owns that.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

      # A loud tripwire on main while a release PR is open: its branch must
      # carry the new version in Cargo.toml and in every workspace member's
      # Cargo.lock entry, or the release build's --locked fails halfway through
      # shipping. A member added to the workspace but not to extra-files shows
      # up here first.
      - name: Verify the release branch's version stamps
        env:
          BRANCH: release-please--branches--main--components--universal-tiling-window-manager
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "no open release branch; nothing to verify"
            exit 0
          fi
          git fetch --depth=1 origin "$BRANCH"
          # The awk scripts read to the end of their input: exiting early
          # would SIGPIPE git show under pipefail.
          want=$(git show FETCH_HEAD:.release-please-manifest.json | jq -r '."."')
          toml=$(git show FETCH_HEAD:Cargo.toml | awk '/x-release-please-version/ { match($0, /"[^"]+"/); print substr($0, RSTART + 1, RLENGTH - 2) }')
          # The workspace's own packages are the Cargo.lock entries with no source.
          stale=$(git show FETCH_HEAD:Cargo.lock | awk -v want="\"$want\"" '
            function check() { if (name != "" && !source && version != want) print name }
            /^\[\[package\]\]$/ { check(); name = ""; version = ""; source = 0; next }
            /^name = / { name = $3 }
            /^version = / { version = $3 }
            /^source = / { source = 1 }
            END { check() }' | tr '\n' ' ')
          echo "release branch wants $want (Cargo.toml: $toml)"
          [ "$toml" = "$want" ] && [ -z "$stale" ] \
            || { echo "::error::release branch stamps out of sync with $want in ${stale:-Cargo.toml}; check extra-files in release-please-config.json"; exit 1; }

      # The pipeline keys off what the repo shows, never a tool's memory of
      # what it did. The manifest names the current version: 0.0.0 means
      # nothing has been released yet; no release for it means this push
      # merged the release PR, so cut the tag at this run's own commit and a
      # draft release on it; a draft means an earlier attempt died before
      # publishing, so ship it, rebuilt and re-signed, which no installed copy
      # can notice, since none has seen it; a published release is finished
      # and never rebuilt, since re-signing a tag that installed copies already
      # fetched breaks their updates.
      - name: Resolve or cut the release
        id: effective
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v$version"
          if [ "$version" = "0.0.0" ]; then
            echo "nothing released yet; the first release PR sets the version"
            { echo "release_created=false"; echo "tag_name="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "::notice::shipping draft release $tag (attempt ${{ github.run_attempt }})"
              { echo "release_created=true"; echo "tag_name=$tag"; } >> "$GITHUB_OUTPUT"
            else
              echo "$tag is released; nothing to ship"
              { echo "release_created=false"; echo "tag_name="; } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The version's CHANGELOG section becomes the release notes. Its
          # heading links a comparison with the release before, except for
          # the first release, which has none to compare with.
          notes=$(awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 || index($0, "## " ver " ") == 1 { grab = 1; next }
            grab && index($0, "## ") == 1 { exit }
            grab { print }
          ' CHANGELOG.md)
          # A draft gets no tag until it is published, and CI and the builds
          # check the tag out, so the tag comes first. A tag left by an
          # attempt that died before its draft keeps its commit.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "::notice::tagged $tag at ${GITHUB_SHA:0:7}"
          fi
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes "${notes:-$tag}"
          echo "::notice::cut $tag as a draft"
          { echo "release_created=true"; echo "tag_name=$tag"; } >> "$GITHUB_OUTPUT"

      # Tagging is what flips a merged release PR's label; with tagging done
      # here, so is the flip. release-please won't open the next release PR
      # while a merged one still reads "pending".
      - name: Flip the release PR label (pending → tagged)
        if: ${{ steps.effective.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr edit "$n" --remove-label "autorelease: pending" --add-label "autorelease: tagged" \
              || echo "::warning::could not flip the autorelease label on PR #$n"
          done

  # Nothing ships unless the tag passes the same checks as a pull request.
  ci:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}

  # Builds, signs and notarizes the app, then packages it twice: a zip to
  # download and install by hand, and the archive the updater unpacks over an
  # installed copy, with its signature. Nothing here can publish: the
  # signing material stays in this job, and attaching is publish's.
  build-macos:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC, to read the updater and Apple signing keys
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      APP: target/universal-apple-darwin/release/bundle/macos/Window Manager.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: universal

      # The role is main-only (infra/release-signing.tf), so no branch or
      # pull request run can read what it reads.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      # The secret is JSON {key, password}: the key goes to a file, the
      # password into the environment, masked.
      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      # The Developer ID certificate goes straight into a keychain of this
      # run's own and the notary key into a file: neither rides the
      # environment, which the runner echoes into later steps' logs.
      - name: Load the Apple signing material
        run: |
          set -euo pipefail
          s=$(aws secretsmanager get-secret-value --secret-id lux/apple-signing --query SecretString --output text)
          for field in certificate_password api_key_id api_issuer_id; do
            echo "::add-mask::$(printf '%s' "$s" | jq -r ".$field")"
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$s" | jq -r '.certificate' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$(printf '%s' "$s" | jq -r '.certificate_password')" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Searched first, ahead of the keychains already listed.
          keychains=("$keychain")
          while read -r listed; do keychains+=("${listed//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain"
          printf '%s' "$s" | jq -r '.api_key' > "$RUNNER_TEMP/notary.p8"
          {
            echo "KEYCHAIN=$keychain"
            echo "UTWM_SIGN_IDENTITY=$(printf '%s' "$s" | jq -r '.signing_identity')"
            echo "NOTARY_KEY_ID=$(printf '%s' "$s" | jq -r '.api_key_id')"
            echo "NOTARY_ISSUER=$(printf '%s' "$s" | jq -r '.api_issuer_id')"
          } >> "$GITHUB_ENV"

      # The bundler signs with UTWM_SIGN_IDENTITY, the hardened runtime and a
      # secure timestamp, which is what notarization asks for.
      - name: Build and sign the app
        run: cargo run --locked -p utwm-bundle -- --universal

      - name: Notarize the app and staple the ticket
        run: |
          set -euo pipefail
          notary=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" \
            --wait --timeout 30m --output-format json || true)
          echo "$result" | jq '{id, status, message}'
          if [ "$(jq -r '.status' <<<"$result")" != "Accepted" ]; then
            id=$(jq -r '.id // empty' <<<"$result")
            if [ -n "$id" ]; then xcrun notarytool log "$id" "${notary[@]}"; fi
            echo "::error::notarization did not accept the app"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # What Gatekeeper makes of it, for the log; the stapled ticket is the check.
          spctl --assess --type execute --verbose=2 "$APP" || echo "::warning::spctl did not accept the app on this runner"

      # Named as Tauri's release action names them, with a hyphen for the
      # space in "Window Manager", which GitHub would turn into a dot in an
      # asset's name. The archive's signature records the version, so the
      # updater rejects a latest.json that pairs it with any other.
      - name: Package the app and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          out="$RUNNER_TEMP/macos"
          mkdir -p "$out"
          ditto -c -k --keepParent "$APP" "$out/Window-Manager_${version}_universal.zip"
          tarball="Window-Manager_${version}_universal.app.tar.gz"
          tar --no-mac-metadata --no-xattrs -czf "$out/$tarball" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$tarball" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: ${{ runner.temp }}/macos
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing material
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/notary.p8"

  # Tauri's CLI builds the release's two executables and the NSIS installer
  # around them: the command line, and with the ui-access feature the tray
  # app, whose manifest asks for UI Access so that it can move administrators'
  # windows. The installer installs both for every user under Program Files,
  # asking for an administrator, which is what Windows grants UI Access
  # under, and is what the updater runs. Tauri Authenticode-signs everything
  # it packs as it goes (both executables, NSIS's plugins and uninstaller,
  # and the installer) as New Earth Technologies, through Azure Artifact
  # Signing, where Microsoft holds the key; Windows starts a UI Access
  # executable only when it is signed. The job signs in to Azure as it does
  # to AWS, with GitHub's OIDC token and no secret, which only a run on main
  # can do.
  build-windows:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC, for AWS to read the updater signing key and for Azure to sign
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      # signtool signs through Artifact Signing's plugin, from Microsoft's
      # NuGet package at a pinned version and hash; it runs on the image's
      # .NET. The plugin needs signtool from Windows SDK 10.0.22621.755 or
      # later, so the newest x64 one on the image signs. metadata.json names
      # the account and certificate profile and leaves the plugin one way to
      # sign in, the Azure CLI's, so a broken sign-in fails at once rather
      # than after trying every other way; its JSON reader rejects a
      # byte-order mark, which pwsh doesn't write. The overlay gives Tauri the
      # command it signs each file with, %1 standing for the file, and stays
      # out of tauri.conf.json, so a build from source never needs Azure.
      - name: Set up Authenticode signing
        shell: pwsh
        env:
          CLIENT_VERSION: 1.0.146
          CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
        run: |
          $dir = Join-Path $env:RUNNER_TEMP signing
          New-Item -ItemType Directory -Force $dir | Out-Null
          $package = Join-Path $dir client.nupkg
          Invoke-WebRequest -MaximumRetryCount 3 -OutFile $package `
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:CLIENT_VERSION/microsoft.artifactsigning.client.$env:CLIENT_VERSION.nupkg"
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash
          if ($hash -ne $env:CLIENT_SHA256) { throw "Microsoft.ArtifactSigning.Client $env:CLIENT_VERSION hashes to $hash, not $env:CLIENT_SHA256" }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package, (Join-Path $dir client))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { $_.VersionInfo.FileVersionRaw } | Select-Object -Last 1
          if (-not $signtool -or $signtool.VersionInfo.FileVersionRaw -lt [version]'10.0.22621.755') {
            throw 'no x64 signtool from Windows SDK 10.0.22621.755 or later'
          }
          "signtool $($signtool.VersionInfo.FileVersionRaw): $($signtool.FullName)"
          $metadata = Join-Path $dir metadata.json
          [ordered]@{
            Endpoint               = 'https://wus2.codesigning.azure.net'
            CodeSigningAccountName = 'newearthsigning'
            CertificateProfileName = 'newearthpublic'
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM $metadata
          $command = @{
            cmd  = $signtool.FullName
            args = @(
              'sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
              '/d', 'Window Manager', '/dlib', (Join-Path $dir client\bin\x64\Azure.CodeSigning.Dlib.dll),
              '/dmdf', $metadata, '%1'
            )
          }
          $overlay = Join-Path $dir tauri.signing.json
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM $overlay
          Get-Content $overlay

      # The release job's own app registration, which may sign with the
      # certificate profile and do nothing else: no secret, no subscription,
      # and a federated credential that trusts main alone, all made by hand,
      # as infra/release-signing.tf records.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 69a42c7d-d0f6-408d-bf01-82db599b34c5
          tenant-id: 47c77a73-f5f6-4bef-b9ea-569714d03d22
          allow-no-subscriptions: true

      # The Azure CLI signed in with GitHub's OIDC token, which lasts five
      # minutes and which the CLI can't renew, so after that it can get no
      # token for a scope it hasn't fetched yet. The plugin asks it for the
      # signing scope's token at every file, well into the build, so that
      # token is fetched now, and the CLI hands the plugin its cached copy,
      # good for an hour or so.
      - name: Fetch the signing token
        shell: pwsh
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none

      - name: Build and sign the installer
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@3.0.0-alpha.5 build --bundles nsis --ci --features ui-access --config "$RUNNER_TEMP/signing/tauri.signing.json"

      # Nothing ships unless it is signed by New Earth Technologies and
      # timestamped: the certificate lasts three days, and the timestamp is
      # what keeps a signature valid after it expires, and with it the tray
      # app's UI Access. The signed command line is only inside the installer,
      # since Tauri puts the unsigned build back in target/release once it has
      # packed it, and the tray app is packed under its Cargo name,
      # window-manager.exe, which the installer changes. So is the signed
      # uninstaller, and NSIS packs it unsigned if signing it fails, without
      # stopping. 7-Zip unpacks all three to be checked; this installer's
      # uninstaller takes 7-Zip 23.01 or later, which the image has. The tray
      # app must ask for UI Access and the command line must not, or a
      # terminal couldn't start it.
      - name: Check the signatures
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem target/release/bundle/nsis/*_x64-setup.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $installer = $installer[0].FullName
          $unpacked = Join-Path $env:RUNNER_TEMP unpacked
          7z e $installer "-o$unpacked" -r universal-tiling-window-manager.exe window-manager.exe uninstall.exe -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw '7-Zip could not unpack the installer' }
          $failed = 0
          $commandLine = Join-Path $unpacked universal-tiling-window-manager.exe
          $tray = Join-Path $unpacked window-manager.exe
          foreach ($file in $commandLine, $tray, (Join-Path $unpacked uninstall.exe), $installer) {
            if (-not (Test-Path $file)) {
              "::error::the installer holds no $(Split-Path -Leaf $file) that 7-Zip could unpack"
              $failed++
              continue
            }
            $s = Get-AuthenticodeSignature $file
            "$(Split-Path -Leaf $file): $($s.Status), signed by $($s.SignerCertificate.Subject), timestamped by $($s.TimeStamperCertificate.Subject)"
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notlike 'CN=New Earth Technologies,*' -or -not $s.TimeStamperCertificate) {
              "::error::$(Split-Path -Leaf $file) is not signed by New Earth Technologies with a timestamp"
              $failed++
            }
          }
          foreach ($check in @{ File = $commandLine; Wants = 'uiAccess="false"' }, @{ File = $tray; Wants = 'uiAccess="true"' }) {
            if (-not (Test-Path $check.File)) { continue }
            $text = [IO.File]::ReadAllText($check.File, [Text.Encoding]::Latin1)
            if ($text.Contains($check.Wants)) {
              "$(Split-Path -Leaf $check.File): manifest asks for $($check.Wants)"
            } else {
              "::error::$(Split-Path -Leaf $check.File)'s manifest doesn't ask for $($check.Wants)"
              $failed++
            }
          }
          if ($failed) { exit 1 }

      # Named like the Mac's files; the installer's updater signature records
      # the version, as the archive's does. It is made here, after
      # Authenticode signing changed the installer's bytes, so it covers the
      # installer that ships.
      - name: Package the installer and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(target/release/bundle/nsis/*_x64-setup.exe)
          [ "${#built[@]}" = 1 ] || { echo "::error::expected one installer, found ${#built[@]}"; exit 1; }
          name=$(basename "${built[0]}")
          version=${name#Window Manager_}
          version=${version%_x64-setup.exe}
          out="$RUNNER_TEMP/windows"
          mkdir -p "$out"
          installer="Window-Manager_${version}_x64-setup.exe"
          cp "${built[0]}" "$out/$installer"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$installer" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/windows
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

  # The Linux executable, which is the download and the update both: `install`
  # puts a download in ~/.local/bin, and the updater writes a newer one over
  # an installed copy, which puts the rest back itself when it starts. Built
  # here, it needs the same system libraries as CI's Linux job.
  build-linux:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC, to read the updater signing key
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build the executable
        run: cargo build --locked --release -p universal-tiling-window-manager

      # Named like the other platforms' files, by the architecture `uname -m`
      # reports; the signature records the version, as theirs do.
      - name: Package the executable and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          built=target/release/universal-tiling-window-manager
          version=$("$built" version)
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out"
          executable="Window-Manager_${version}_x86_64"
          cp "$built" "$out/$executable"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$executable" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

  # Attaches every build to the draft, with latest.json, the file every
  # installed copy polls, then publishes it. Publishing is what "released"
  # means: installed copies read latest.json from the latest published
  # release, so until then they see the release before it. A published
  # release whose downloads don't answer goes back to being a draft.
  publish:
    needs: [release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the release assets and publish the release
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      MAC_VERSION: ${{ needs.build-macos.outputs.version }}
      WINDOWS_VERSION: ${{ needs.build-windows.outputs.version }}
      LINUX_VERSION: ${{ needs.build-linux.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux

      # The tag comes from release-please's manifest and each version from a
      # build: a disagreement means a stamp drifted, and publishing across it
      # would announce a version nobody can download.
      - name: Verify the built versions match the tag
        run: |
          for version in "$MAC_VERSION" "$WINDOWS_VERSION" "$LINUX_VERSION"; do
            test "v$version" = "$TAG" \
              || { echo "::error::built version $version does not match release tag $TAG"; exit 1; }
          done

      - name: Attach the builds to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/macos" "$RUNNER_TEMP/windows" "$RUNNER_TEMP/linux"
          gh release upload "$TAG" "$RUNNER_TEMP"/macos/* "$RUNNER_TEMP"/windows/* "$RUNNER_TEMP"/linux/* --clobber -R "$GITHUB_REPOSITORY"

      # The shape Tauri's own release action writes: every darwin key names
      # the one universal archive, both Windows keys the installer, and the
      # Linux key the executable, each with its signature. A build that no
      # bundler marked looks for that plain key. The URLs are the public
      # download links rather than the REST asset URLs, which would put every
      # update on GitHub's unauthenticated API rate limit.
      - name: Attach the updater manifest to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          mac="Window-Manager_${version}_universal.app.tar.gz"
          windows="Window-Manager_${version}_x64-setup.exe"
          linux="Window-Manager_${version}_x86_64"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n --arg version "$version" \
                --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                --arg mac_url "$base/$mac" \
                --arg mac_signature "$(cat "$RUNNER_TEMP/macos/$mac.sig")" \
                --arg windows_url "$base/$windows" \
                --arg windows_signature "$(cat "$RUNNER_TEMP/windows/$windows.sig")" \
                --arg linux_url "$base/$linux" \
                --arg linux_signature "$(cat "$RUNNER_TEMP/linux/$linux.sig")" \
            '{version: $version, notes: "", pub_date: $pub_date,
              platforms: (
                (["darwin-aarch64", "darwin-x86_64", "darwin-universal",
                  "darwin-aarch64-app", "darwin-x86_64-app", "darwin-universal-app"]
                 | map({key: ., value: {signature: $mac_signature, url: $mac_url}}))
                + (["windows-x86_64", "windows-x86_64-nsis"]
                   | map({key: ., value: {signature: $windows_signature, url: $windows_url}}))
                + (["linux-x86_64"]
                   | map({key: ., value: {signature: $linux_signature, url: $linux_url}}))
                | from_entries)}' > "$RUNNER_TEMP/latest.json"
          jq '.platforms | keys' "$RUNNER_TEMP/latest.json"
          # A draft's files answer at their public links only once it is
          # published, which is when the links are checked. Here the draft
          # must hold every file the manifest names.
          attached=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' -R "$GITHUB_REPOSITORY")
          for file in "$mac" "$windows" "$linux"; do
            grep -qxF "$file" <<< "$attached" || { echo "::error::the draft holds no $file"; exit 1; }
          done
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber -R "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"

      # A manifest is worth what the URLs inside it resolve to. This release
      # must now be the latest, and its latest.json and every download it
      # names must answer at their public links. One that fails goes back to
      # being a draft, and installed copies back to the release before it.
      - name: Check what installed copies fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          failed=""
          latest=""
          for _ in 1 2 3; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name') && break
            sleep 5
          done
          [ "$latest" = "$TAG" ] || failed="the latest release is ${latest:-unknown}, not $TAG"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for url in "$base/latest.json" $(jq -r '[.platforms[].url] | unique | .[]' "$RUNNER_TEMP/latest.json"); do
            code=$(curl -sSL --fail --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null -w '%{http_code}' "$url") || true
            [ "$code" = "200" ] || failed="${failed:+$failed; }$url answered ${code:-nothing}"
          done
          if [ -n "$failed" ]; then
            echo "::error::$failed"
            if gh release edit "$TAG" --draft=true -R "$GITHUB_REPOSITORY"; then
              echo "::error::$TAG is a draft again; re-run this workflow to ship it"
            else
              echo "::error::$TAG could not go back to being a draft, so installed copies can see it"
            fi
            exit 1
          fi
          echo "released $TAG"
