[package]
name = "universal-tiling-window-manager"
description = "A tiling window manager you drive from the keyboard, on Windows, the Mac and Linux, with one configuration for all three"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "universal-tiling-window-manager"

[[bin]]
name = "universal-tiling-window-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
utwm-config.workspace = true
utwm-layout.workspace = true
# tauri::generate_context! writes the plugins' configuration out as JSON.
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Tauri 3 is in alpha; every Tauri crate is pinned to an exact release so an
# alpha bump can't change the app underneath a build.
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon", "image-png"] }
tauri-runtime-wry = "=3.0.0-alpha.5"
tauri-plugin-single-instance = "=3.0.0-alpha.3"

[target.'cfg(windows)'.dependencies]
utwm-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
utwm-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
utwm-linux.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Installs releases (src/updates.rs). native-tls is the system's own TLS
# (Schannel on Windows, Security.framework on the Mac), so no TLS library of
# the plugin's choosing comes along.
tauri-plugin-updater = { version = "=3.0.0-alpha.3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The menu library Tauri builds on, at the version it pins, so the tests can
# check that every menu accelerator this app writes parses the way Tauri will
# parse it (Tauri drops one that doesn't, silently).
muda = "=0.20.0"

[features]
# Release builds embed their configuration; `cargo install` builds this way.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
