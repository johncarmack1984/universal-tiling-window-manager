name: release

# release-please (the pinned action, on the workflow's own GITHUB_TOKEN) keeps
# a release PR open from conventional-commit history: the version bump, the
# CHANGELOG, and every version stamp through extra-files. Merging it lands the
# bumped manifest on main, and this run ships it: the release job cuts the
# vX.Y.Z tag and an assetless GitHub Release, and CI gates the tag. Then the
# Mac app is built for Apple silicon and Intel, signed with the Developer ID
# and notarized, and the Windows installer and the Linux executable are built
# beside it. All three are attached, with the updater's latest.json last. That
# file going up is what installed copies see, so a release that failed
# anywhere before it never reaches them.
on:
  push:
    branches: [main]

permissions: {}

# One release run at a time, never cancelled: a queued run must not tag a
# commit its gates didn't see, and the cut step tags only its own commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release-please's branch pushes, and the tag and release cut below
      pull-requests: write # release-please's PR bookkeeping, and the label flip
    outputs:
      release_created: ${{ steps.effective.outputs.release_created }}
      tag_name: ${{ steps.effective.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # skip-github-release in the config keeps the action away from tagging;
      # the cut step below owns that.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

      # A loud tripwire on main while a release PR is open: its branch must
      # carry the new version in Cargo.toml and in every workspace member's
      # Cargo.lock entry, or the release build's --locked fails halfway through
      # shipping. A member added to the workspace but not to extra-files shows
      # up here first.
      - name: Verify the release branch's version stamps
        env:
          BRANCH: release-please--branches--main--components--universal-tiling-window-manager
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "no open release branch; nothing to verify"
            exit 0
          fi
          git fetch --depth=1 origin "$BRANCH"
          # The awk scripts read to the end of their input: exiting early
          # would SIGPIPE git show under pipefail.
          want=$(git show FETCH_HEAD:.release-please-manifest.json | jq -r '."."')
          toml=$(git show FETCH_HEAD:Cargo.toml | awk '/x-release-please-version/ { match($0, /"[^"]+"/); print substr($0, RSTART + 1, RLENGTH - 2) }')
          # The workspace's own packages are the Cargo.lock entries with no source.
          stale=$(git show FETCH_HEAD:Cargo.lock | awk -v want="\"$want\"" '
            function check() { if (name != "" && !source && version != want) print name }
            /^\[\[package\]\]$/ { check(); name = ""; version = ""; source = 0; next }
            /^name = / { name = $3 }
            /^version = / { version = $3 }
            /^source = / { source = 1 }
            END { check() }' | tr '\n' ' ')
          echo "release branch wants $want (Cargo.toml: $toml)"
          [ "$toml" = "$want" ] && [ -z "$stale" ] \
            || { echo "::error::release branch stamps out of sync with $want in ${stale:-Cargo.toml}; check extra-files in release-please-config.json"; exit 1; }

      # The pipeline keys off what the repo shows, never a tool's memory of
      # what it did. The manifest names the current version: 0.0.0 means
      # nothing has been released yet; no release for it means this push
      # merged the release PR, so cut the tag and an assetless release at this
      # run's own commit; an assetless release means an earlier attempt died
      # before the app landed, so ship it; a release with assets is finished
      # and never rebuilt, since re-signing a tag that installed copies already
      # fetched breaks their updates.
      - name: Resolve or cut the release
        id: effective
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v$version"
          if [ "$version" = "0.0.0" ]; then
            echo "nothing released yet; the first release PR sets the version"
            { echo "release_created=false"; echo "tag_name="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null); then
            if [ "$assets" = "0" ]; then
              echo "::notice::shipping assetless release $tag (attempt ${{ github.run_attempt }})"
              { echo "release_created=true"; echo "tag_name=$tag"; } >> "$GITHUB_OUTPUT"
            else
              echo "$tag is fully released; nothing to ship"
              { echo "release_created=false"; echo "tag_name="; } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The version's CHANGELOG section becomes the release notes. Its
          # heading links a comparison with the release before, except for
          # the first release, which has none to compare with.
          notes=$(awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 || index($0, "## " ver " ") == 1 { grab = 1; next }
            grab && index($0, "## ") == 1 { exit }
            grab { print }
          ' CHANGELOG.md)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-$tag}"
          echo "::notice::cut $tag at ${GITHUB_SHA:0:7}"
          { echo "release_created=true"; echo "tag_name=$tag"; } >> "$GITHUB_OUTPUT"

      # Tagging is what flips a merged release PR's label; with tagging done
      # here, so is the flip. release-please won't open the next release PR
      # while a merged one still reads "pending".
      - name: Flip the release PR label (pending → tagged)
        if: ${{ steps.effective.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr edit "$n" --remove-label "autorelease: pending" --add-label "autorelease: tagged" \
              || echo "::warning::could not flip the autorelease label on PR #$n"
          done

  # Nothing ships unless the tag passes the same checks as a pull request.
  ci:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}

  # Builds, signs and notarizes the app, then packages it twice: a zip to
  # download and install by hand, and the archive the updater unpacks over an
  # installed copy, with its signature. Nothing here can publish: the
  # signing material stays in this job, and attaching is publish's.
  build-macos:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC, to read the updater and Apple signing keys
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      APP: target/universal-apple-darwin/release/bundle/macos/Window Manager.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: universal

      # The role is main-only (infra/release-signing.tf), so no branch or
      # pull request run can read what it reads.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      # The secret is JSON {key, password}: the key goes to a file, the
      # password into the environment, masked.
      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      # The Developer ID certificate goes straight into a keychain of this
      # run's own and the notary key into a file: neither rides the
      # environment, which the runner echoes into later steps' logs.
      - name: Load the Apple signing material
        run: |
          set -euo pipefail
          s=$(aws secretsmanager get-secret-value --secret-id lux/apple-signing --query SecretString --output text)
          for field in certificate_password api_key_id api_issuer_id; do
            echo "::add-mask::$(printf '%s' "$s" | jq -r ".$field")"
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$s" | jq -r '.certificate' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$(printf '%s' "$s" | jq -r '.certificate_password')" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Searched first, ahead of the keychains already listed.
          keychains=("$keychain")
          while read -r listed; do keychains+=("${listed//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain"
          printf '%s' "$s" | jq -r '.api_key' > "$RUNNER_TEMP/notary.p8"
          {
            echo "KEYCHAIN=$keychain"
            echo "UTWM_SIGN_IDENTITY=$(printf '%s' "$s" | jq -r '.signing_identity')"
            echo "NOTARY_KEY_ID=$(printf '%s' "$s" | jq -r '.api_key_id')"
            echo "NOTARY_ISSUER=$(printf '%s' "$s" | jq -r '.api_issuer_id')"
          } >> "$GITHUB_ENV"

      # The bundler signs with UTWM_SIGN_IDENTITY, the hardened runtime and a
      # secure timestamp, which is what notarization asks for.
      - name: Build and sign the app
        run: cargo run --locked -p utwm-bundle -- --universal

      - name: Notarize the app and staple the ticket
        run: |
          set -euo pipefail
          notary=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" \
            --wait --timeout 30m --output-format json || true)
          echo "$result" | jq '{id, status, message}'
          if [ "$(jq -r '.status' <<<"$result")" != "Accepted" ]; then
            id=$(jq -r '.id // empty' <<<"$result")
            if [ -n "$id" ]; then xcrun notarytool log "$id" "${notary[@]}"; fi
            echo "::error::notarization did not accept the app"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # What Gatekeeper makes of it, for the log; the stapled ticket is the check.
          spctl --assess --type execute --verbose=2 "$APP" || echo "::warning::spctl did not accept the app on this runner"

      # Named as Tauri's release action names them, with a hyphen for the
      # space in "Window Manager", which GitHub would turn into a dot in an
      # asset's name. The archive's signature records the version, so the
      # updater rejects a latest.json that pairs it with any other.
      - name: Package the app and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          out="$RUNNER_TEMP/macos"
          mkdir -p "$out"
          ditto -c -k --keepParent "$APP" "$out/Window-Manager_${version}_universal.zip"
          tarball="Window-Manager_${version}_universal.app.tar.gz"
          tar --no-mac-metadata --no-xattrs -czf "$out/$tarball" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$tarball" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: ${{ runner.temp }}/macos
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing material
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/notary.p8"

  # Tauri's CLI builds the release executable and the NSIS installer around
  # it, marking the executable as the installer's, which is what the app checks
  # before updating itself. The installer installs per user, with no
  # administrator prompt, and is what the updater runs. It isn't
  # Authenticode-signed, so SmartScreen questions a first install by hand.
  build-windows:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC, to read the updater signing key
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build the installer
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@3.0.0-alpha.5 build --bundles nsis --ci

      # Named like the Mac's files; the installer's signature records the
      # version, as the archive's does.
      - name: Package the installer and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(target/release/bundle/nsis/*_x64-setup.exe)
          [ "${#built[@]}" = 1 ] || { echo "::error::expected one installer, found ${#built[@]}"; exit 1; }
          name=$(basename "${built[0]}")
          version=${name#Window Manager_}
          version=${version%_x64-setup.exe}
          out="$RUNNER_TEMP/windows"
          mkdir -p "$out"
          installer="Window-Manager_${version}_x64-setup.exe"
          cp "${built[0]}" "$out/$installer"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$installer" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/windows
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

  # The Linux executable, which is the download and the update both: `install`
  # puts a download in ~/.local/bin, and the updater writes a newer one over
  # an installed copy, which puts the rest back itself when it starts. Built
  # here, it needs the same system libraries as CI's Linux job.
  build-linux:
    needs: [release, ci]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC, to read the updater signing key
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::735853783919:role/universal-tiling-window-manager-release-signing
          aws-region: us-west-1

      - name: Load the updater signing key
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id universal-tiling-window-manager/updater-signing-key --query SecretString --output text)
          password=$(printf '%s' "$secret" | jq -r '.password')
          echo "::add-mask::$password"
          printf '%s' "$secret" | jq -j '.key' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build the executable
        run: cargo build --locked --release -p universal-tiling-window-manager

      # Named like the other platforms' files, by the architecture `uname -m`
      # reports; the signature records the version, as theirs do.
      - name: Package the executable and sign the update
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
        run: |
          set -euo pipefail
          built=target/release/universal-tiling-window-manager
          version=$("$built" version)
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out"
          executable="Window-Manager_${version}_x86_64"
          cp "$built" "$out/$executable"
          npx --yes @tauri-apps/cli@3.0.0-alpha.5 signer sign --app-version "$version" "$out/$executable" >/dev/null
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

  # Attaches every build to the release, then writes latest.json, the file
  # every installed copy polls. It goes up last, and only once every download
  # it names answers, because its going up is what "released" means.
  publish:
    needs: [release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the release assets
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      MAC_VERSION: ${{ needs.build-macos.outputs.version }}
      WINDOWS_VERSION: ${{ needs.build-windows.outputs.version }}
      LINUX_VERSION: ${{ needs.build-linux.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: ${{ runner.temp }}/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: ${{ runner.temp }}/linux

      # The tag comes from release-please's manifest and each version from a
      # build: a disagreement means a stamp drifted, and publishing across it
      # would announce a version nobody can download.
      - name: Verify the built versions match the tag
        run: |
          for version in "$MAC_VERSION" "$WINDOWS_VERSION" "$LINUX_VERSION"; do
            test "v$version" = "$TAG" \
              || { echo "::error::built version $version does not match release tag $TAG"; exit 1; }
          done

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/macos" "$RUNNER_TEMP/windows" "$RUNNER_TEMP/linux"
          gh release upload "$TAG" "$RUNNER_TEMP"/macos/* "$RUNNER_TEMP"/windows/* "$RUNNER_TEMP"/linux/* --clobber -R "$GITHUB_REPOSITORY"

      # The shape Tauri's own release action writes: every darwin key names
      # the one universal archive, both Windows keys the installer, and the
      # Linux key the executable, each with its signature. A build that no
      # bundler marked looks for that plain key. The URLs are the public
      # download links rather than the REST asset URLs, which would put every
      # update on GitHub's unauthenticated API rate limit.
      - name: Publish the updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          mac="Window-Manager_${version}_universal.app.tar.gz"
          windows="Window-Manager_${version}_x64-setup.exe"
          linux="Window-Manager_${version}_x86_64"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n --arg version "$version" \
                --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                --arg mac_url "$base/$mac" \
                --arg mac_signature "$(cat "$RUNNER_TEMP/macos/$mac.sig")" \
                --arg windows_url "$base/$windows" \
                --arg windows_signature "$(cat "$RUNNER_TEMP/windows/$windows.sig")" \
                --arg linux_url "$base/$linux" \
                --arg linux_signature "$(cat "$RUNNER_TEMP/linux/$linux.sig")" \
            '{version: $version, notes: "", pub_date: $pub_date,
              platforms: (
                (["darwin-aarch64", "darwin-x86_64", "darwin-universal",
                  "darwin-aarch64-app", "darwin-x86_64-app", "darwin-universal-app"]
                 | map({key: ., value: {signature: $mac_signature, url: $mac_url}}))
                + (["windows-x86_64", "windows-x86_64-nsis"]
                   | map({key: ., value: {signature: $windows_signature, url: $windows_url}}))
                + (["linux-x86_64"]
                   | map({key: ., value: {signature: $linux_signature, url: $linux_url}}))
                | from_entries)}' > "$RUNNER_TEMP/latest.json"
          jq '.platforms | keys' "$RUNNER_TEMP/latest.json"
          # A manifest is worth what the URLs inside it resolve to.
          for url in "$base/$mac" "$base/$windows" "$base/$linux"; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
            test "$code" = "200" || { echo "::error::$url answered $code"; exit 1; }
          done
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber -R "$GITHUB_REPOSITORY"
          echo "published latest.json for $TAG"
