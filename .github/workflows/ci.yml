name: ci

# The pure crates (export parsing, key translation, Rectangle's geometry) build
# and test anywhere, so they gate on Linux, where runners are fastest. The Win32
# crate and the Tauri app only build on Windows; that job also makes the release
# build `cargo install --git` would make, so a broken install fails here first.
#
# The end-to-end check (crates/utwm-windows/examples/e2e.rs) needs a running app
# and a real desktop, so it runs by hand: `just run`, then `just e2e`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -p utwm-config -p utwm-layout -- -D warnings
      - run: cargo test --locked -p utwm-config -p utwm-layout

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo test --locked --workspace
      - name: release build (what cargo install builds)
        run: cargo build --locked --release -p universal-tiling-window-manager
      - name: check an export with the release binary
        shell: pwsh
        run: |
          $out = & target/release/universal-tiling-window-manager.exe check | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Bindings \(22 chords\)') {
            throw "check did not report Rectangle's 22 default shortcuts"
          }

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
